name: CI Native

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.7'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check syntax
        run: python -m py_compile manage.py application/*.py

      - name: Init SQLite database
        run: |
          rm -f todo.sqlite
          python manage.py db upgrade

      - name: Smoke test Flask server
        run: |
          python manage.py runserver &
          sleep 5
          curl -f http://127.0.0.1:7345/
